<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid na Prática</title>
    <style>
        div.container {
            border: 3px solid blue;
            /* height: 250px; */
            display: grid;
            grid-template: repeat(3, 80px) / /*repeat(3, 120px)*/ 1fr 2fr 1fr;
            grid-auto-rows: 80px; /*isso faz com q qqr lina que eu adicionar mais tarde vai ter a mesma dimensão que items têm */
            grid-auto-columns: 120px;
            grid-auto-flow: row; /*coloca a ordem de cima pra baixo*/
            gap: 10px;
            place-items: normal normal;
           place-content: normal normal;
        }

        div.item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
   <div class="container">
    <div class="item">A</div>
    <div class="item">B</div>
    <div class="item">C</div>
    <div class="item">D</div>
    <div class="item">E</div>
    <div class="item">F</div>
    <div class="item">G</div>
    <div class="item">H</div>
    <div class="item">I</div>
    <div class="item">J</div>
   </div>
</body>
</html>
